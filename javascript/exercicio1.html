<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 1</title>
</head>
<body>
    <h1>
        Idade em numero do usuario
    </h1>

    <script>
        let anos = Number(prompt("Digite os anos:"));
        let meses = Number(prompt("Digite os meses:"));
        let dias = Number(prompt("Digite os dias:"));

        let totalDias = (anos * 365) + (meses * 30) + dias;

        document.write("Idade em dias: " + totalDias);
    </script>
</body>
</html>
