<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRESTAÇÃO SEM JUROS</title>
</head>
<body>
    <script>
        let valor = parseFloat(prompt("Informe o valor da sua compra : "))

        let prestacao = valor / 5

        document.write("O valor da suas prestações ficou : " + prestacao)
    </script>
</body>
</html>
