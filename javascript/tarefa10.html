<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reajuste</title>
</head>
<body>
    <h1>
        Reajuste no saldo
    </h1>

    <script>
       let saldo1 = parseFloat(prompt("Digite seu saldo :"))
        document.write("Seu saldo era :" + saldo1)

        let novoSaldo = saldo1 + 1.5
        document.write("<br> Com o reajuste, seu novo saldo é :" + novoSaldo)

    </script>
</body>
</html>
