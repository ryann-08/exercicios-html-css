<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Saldo Médio</title>
</head>
<body>
    <h1>Saldo Médio</h1>

    <script>
        let saldo = parseFloat(prompt("Digite seu saldo médio:"))
        let credito = 0

        if (saldo <= 500) {
            credito = 0
        } 
        else if (saldo > 500 && saldo <= 1000) {
            credito = saldo * 0.30
        } 
        else if (saldo > 1000 && saldo <= 3000) {
            credito = saldo * 0.40
        } 
        else {
            credito = saldo * 0.50
        }

        document.write("Saldo médio: R$ " + saldo )
        document.write("<br> Valor do crédito: R$ " + credito)
    </script>
</body>
</html>
