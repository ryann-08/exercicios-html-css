<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LER VALORES</title>
</head>
<body>

    <script>
        let numero = parseFloat(prompt("Digite um numero : ")) 
        let numero2 = parseFloat(prompt("Digite o segundo numero : ")) 

        while (numero2 <= 0){
         alert("Valor invalido digite outro numero (maior que 0) : ")
         
        }

        let resultado = numero / numero2

        document.write("Esse é o resultado final " + resultado )


    </script>
</body>
</html>
