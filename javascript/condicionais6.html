<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMBO BK</title>
</head>
<body>
    <script>
         let combo = parseFloat(prompt("Digite o numero do combo de sua preferencia (1 ao 5)"))

        switch(combo){

            case 1: ofertas = "Whopper Combo:  <br>Ingredientes do lanche:<br> Pão com gergelim<br> Hambúrguer de carne grelhada<br> Alface<br> Tomate<br> Cebola<br> Picles<br> Maionese<br> Ketchup<br> Acompanha Batata frita + refrigerante<br> 40 R$"
            break

            case 2: ofertas = "Whopper Duplo:<br> Combo Ingredientes: <br>  Pão com gergelim<br> 2 hambúrgueres grelhados<br> Queijo <br>Alface <br>Tomate<br> Cebola<br> Picles<br> Maionese<br>  ketchup<br> Acompanha: Batata + refrigerante  <br> 45 R$"
            break

            case 3: ofertas = "Stacker Duplo Bacon Combo<br> Ingredientes:<br> Pão com gergelim<br> 2 hambúrgueres<br> Muito queijo cheddar <br> Bacon <br> Molho Stacker<br> (cremoso e levemente defumado) <br>Acompanha: Batata + refrigerante <br>35 R$"
            break

            case 4: ofertas = "Chicken Duplo Combo <br>Ingredientes:<br> Pão 2 filés de frango empanado<br> Alface <br>Maionese Acompanha:<br> Batata + refrigerante <br> 30 R$"
            break

            case 5: ofertas = "Rodeio Duplo Combo <br> Ingredientes:<br> Pão 2 hambúrgueres<br> Anéis de cebola <br> Queijo <br>Molho barbecue<br> Acompanha: Batata + refri <br> 32 R$"
            break

            default: ofertas = "Combo inexistente"
        }

        document.write(ofertas)
    </script>
</body>
</html>
