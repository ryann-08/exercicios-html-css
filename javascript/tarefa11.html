<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SALARIO DO VENDEDOR</title>
</head>
<body>
    <h1>
        Salario com comissão
    </h1>

    <script>
        let nome = prompt("Insira seu nome : ").toUpperCase();
        let salario = parseFloat(prompt("Informe seu salario : "))
        let vendas = parseFloat(prompt("Quantas vendas você fez? (em dinheiro) "))

        let comissão = vendas * 0.15 
        let salariototal = comissão + salario

        document.write(nome + " tem um salario fixo de : " + salario)
        document.write("<br>Com a comissão, seu salario ficou : " + salariototal)

    </script>
</body>
</html>
