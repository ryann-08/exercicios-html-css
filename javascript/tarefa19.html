<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DÓLARES PARA REAIS</title>
</head>
<body>
    <script>
        let cotacao = parseFloat(prompt("Qual a cotação do dólar ? "))
        let dollar = parseFloat(prompt("Digite quantos dollares você tem : "))

        let reais = cotacao * dollar

        document.write("Seu valor convertido para REAIS(R$) é :  " + reais)
    </script>
</body>
</html>
