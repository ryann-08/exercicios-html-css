<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDIA DOS NUMEROS</title>
</head>
<body>
    <script>
        let numero1 = parseInt(prompt("digite o primeiro numero : "))
        let numero2 = parseInt(prompt("digite o segundo numero : (tem que ser maior que o primeiro) "))

       let soma = 0
       let quantidade = 0

       for (let i = numero1; i <= numero2; i++) {
       soma += i      
       quantidade++    
}

        let media = soma / quantidade

        document.write("Essa é a média dos dois numeros : " + media)

    </script>
</body>
</html>
