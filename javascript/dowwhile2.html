<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando comandos DOWHILE</title>
</head>
<body>
    <script>
        let n = 0
        let mutiplicador = parseFloat(prompt("digite um numero da tabuada que deseja : "))
        do{
            document.write(n + " x " + multiplicador + " = " + (n * multiplicador) + "<br>")
            n++
        } while (n <= 10)
        
    </script>
</body>
</html>
