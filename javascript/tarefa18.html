<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MENORES DE IDADE</title>
</head>
<body>
    <script>
          let menores = 0

        for (let i = 1; i <= 20; i++) {
    let idade = parseFloat(prompt("Digite a " + i + " idade:"))
    
    if (idade <= 17){
        menores = menores + 1
    }
}
    document.write("<br> As pessoas menores de idades são : " + menores)
 
    </script>
</body>
</html>
