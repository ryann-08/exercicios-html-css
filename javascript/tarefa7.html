<head>

<body>
     <h1>
        média das médias
    </h1>

    <script>
        let media1=(9 + 8 + 7) /3
        let media2=(4 + 5 + 6) /3

       let soma = media1 + media2;
       let mediaDasMedias = (media1 + media2) / 2;

      document.write("Média 1 :", media1);
      document.write("<br>Média 2 :", media2);
      document.write("<br>Soma das médias :", soma);
      document.write("<br>Média das médias :", mediaDasMedias);   
    </script>
</body>
