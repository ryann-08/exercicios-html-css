<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MÉDIA DAS IDADES</title>
</head>
<body>
    
    <script>
     let total = 0;

    for (let i = 1; i <= 20; i++) {
    let num = parseFloat(prompt("Digite a " + i + " idade:"))
    total = total + num 
}
    let media = total / 20
    document.write("<br>A média das idades resultou em: " + media)
 
    </script>
</body>
</html>
