<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numero de N</title>
</head>
<body>
    <script>
       
        let N = parseInt(prompt("Digite um número maior que 0:"));

        for (let i = 1; i <= N; i++) {
        document.write(i + "<br>")
    }
    </script>
</body>
</html>
