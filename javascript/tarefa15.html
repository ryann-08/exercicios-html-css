<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDADE DE 20 PESSOAS</title>
</head>
<body>
    <h1>
        Soma das idades
    </h1>

    <script>
        
        let total = 0;

    for (let i = 1; i <= 20; i++) {
    let num = parseFloat(prompt("Digite a " + i + " idade:"))
    total = total + num 
}
    document.write("<br>A soma das idades resultou em: " + total)
 
    </script>
</body>
</html>
