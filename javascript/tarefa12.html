<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soma do 1 ao 15</title>
</head>
<body>
    <h1>
        1 ao 15
    </h1>

    <script>
       let soma = 0;

    /*FOR = LAÇO DE REPETIÇÃO*/
    for
    (let contadora = 1; contadora <= 15; contadora++) {
        soma += contadora;
        document.write("Somando " + contadora + "    Total: " + soma + "<br>")
    }
    </script>   
</body>
</html>
