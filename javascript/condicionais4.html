<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comandos condicionais usando JS</title>
</head>
<body>
    <h1>
        Testando comandos Switch/Case
    </h1>
    <script>
        semaforo = prompt("Digite a cor do semaforo")

        switch(semaforo){
            case "vermelho": alert("PARE")
            break

            case "verde": alert("SIGA")
            break

            case "amarelo": alert("ATENÇÃO")
            break

            default : alert("COR INVALIDA")
        }
    </script>
</body>
</html>
