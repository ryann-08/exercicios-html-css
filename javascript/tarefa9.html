     <h1>
        Salarios

    <script>
        let salario = parseFloat(prompt("Digite seu salário, com ponto:"));
        let salariomin =(1.212)

        let total = (salario / salariomin)
        document.write("Seu salario é " + total + " salarios minimos ")
    </script>
