<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numero divisível</title>
</head>
<body>
    <h1>
        divisão
    </h1>

    <script>
        let numero = Number(prompt("Digite um numero : " ));

        if(numero % 10 == 0){
            document.write("Divisivel por 10")
        }
         if(numero % 5 == 0){
            document.write("<br>Divisivel por 5")
        }
         if(numero % 2 == 0){
            document.write("<br>Divisivel por 2")
        }
        else{
            document.write("<br>Não é divisivel por nenhum")

        }
    </script>
</body>
</html>
