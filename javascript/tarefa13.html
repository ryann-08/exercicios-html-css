<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRAUS C e F</title>
</head>
<body>
    <script>
        let grausc = parseFloat(prompt("Digite os graus Celsius : "))

        let Fahrenheit=(9*grausc+160) / 5

        document.write("Os graus convertido para Fahrenheit é : " + Fahrenheit)
    </script>
</body>
</html>
