<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MÉDIA DE 15 A 100</title>
</head>
<body>
   <script>
    let soma =0
    let contador =0

    for(let i = 15; i <=100; i++){
        soma +=i
        contador++
    }

    let media = soma / contador

    document.write("a média é : " + media)
   </script> 
</body>
</html>
