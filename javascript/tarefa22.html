<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENTRE 0 E 100</title>
</head>
<body>
    <script>
        let menores = 0

        for (let i = 1; i <= 20; i++) {
    let numero = parseFloat(prompt("Digite o " + i + " numero:"))
    
    if (numero <= 100 && numero >=0 ){
        menores = menores + 1
    }
}
    document.write("<br> Entre zero e cem são : " + menores)
 
    </script>
</body>
</html>
