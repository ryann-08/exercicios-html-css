<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>testando WHILE</title>
</head>
<body>
    <script>
        let n = 1
        while(n<=100){
            document.write(n)
            n+=2
        }
    </script>
</body>
</html>
