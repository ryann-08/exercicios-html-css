<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>testando switch/case</title>
</head>
<body>
    <script>
        let diaSemana = parseFloat(prompt("entre com o no. do dia da semana"))

        switch(diaSemana){
            case 1: nomeDia = "Domingo"
            break
            case 2: nomeDia = "segunda feira"
            break
             case 3: nomeDia = "terça feira"
            break
            case 4: nomeDia = "quarta feira"
            break
            case 5: nomeDia = "Quinta feira"
            break
            case 6: nomeDia = "Sexta feira"
            break
            case 7: nomeDia = "Sabado"
            break

            default: nomeDia = "dia inexistente"
        }

        document.write(nomeDia)
    </script>
</body>
</html>
