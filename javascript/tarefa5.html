<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classe eleitoral</title>
</head>
<body>
    <h1>
        Vota ou não vota
    </h1>

    <script>
        let numero = parseFloat(prompt("Digite sua Idade : "))

        if (numero <16){
            document.write("Não pode votar ")
        }
        else if(numero >= 16 && numero <= 17){
            document.write("Eleitor facultativo")
        }
        else if(numero >=18 && numero <= 65){
            document.write("Eleitor obrigatorio")
        }
        else
        document.write("Eleitor facultativo")
    </script>
</body>
</html>
