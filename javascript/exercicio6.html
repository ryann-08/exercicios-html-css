<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio 6</title>
</head>
<body>
    <h1>
        Antecessor e Sucessor
    </h1>

    <script>
        let numero1 = Number(prompt("Digite um numero : " ));
        
        let Antessesor = numero1 - 1
        let Sucessor = numero1 + 1
        document.write("O sucessor é " + Sucessor )
        document.write("<br>Seu numero é " + numero1 )
        document.write("<br>O antecessor é " + Antessesor )
        

    </script>
</body>
</html>
