<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUMERO NEGATIVO</title>
</head>
<body>
    <script>
        let numero = 0

        for (let i = 1; i > 0; i++) {
    let soma = parseFloat(prompt("Digite o " + i + " numero, Para parar basta adicionar um numero negativo "))
    
      if (soma >= 0 ) {
        numero = numero + soma 

        } else if (soma < 0 ) {
           break
            
        } 
    }
     document.write("A soma dos numeros foram : " + numero )

    </script>
</body>
</html>
