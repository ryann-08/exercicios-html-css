<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas do alunos</title>
</head>
<body>
    <script>
let nota1 = parseFloat(prompt("Digite a 1ª nota:"));
while (nota1 < 0 || nota1 > 10 || isNaN(nota1)) {
    alert("Nota inválida! Digite entre 0 e 10.");
    nota1 = parseFloat(prompt("Digite a 1ª nota:"));
}

let nota2 = parseFloat(prompt("Digite a 2ª nota:"));
while (nota2 < 0 || nota2 > 10 || isNaN(nota2)) {
    alert("Nota inválida! Digite entre 0 e 10.");

}

}

let nota4 = parseFloat(prompt("Digite a 4ª nota:"));
while (nota4 < 0 || nota4 > 10 || isNaN(nota4)) {
    alert("Nota inválida! Digite entre 0 e 10.");
    nota4 = parseFloat(prompt("Digite a 4ª nota:"));

let nota5 = parseFloat(prompt("Digite a 5ª nota:"));
while (nota5 < 0 || nota5 > 10 || isNaN(nota5)) {
    alert("Nota inválida! Digite entre 0 e 10.");
    nota5 = parseFloat(prompt("Digite a 5ª nota:"));
}

let nota6 = parseFloat(prompt("Digite a 6ª nota:"));
while (nota6 < 0 || nota6 > 10 || isNaN(nota6)) {
    alert("Nota inválida! Digite entre 0 e 10.");
    nota6 = parseFloat(prompt("Digite a 6ª nota:"));
}

let media = (nota1 + nota2 + nota3 + nota4 + nota5 + nota6) / 6;

alert("Sua média é: " + media);
</script>
</body>
</html>
