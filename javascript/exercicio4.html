<body>
    <h1>
        IPI

    <script>
        let ipi = Number(prompt("Digite a porcentagem do IPI, apenas numeros:"));

        let cod1 = prompt("Código da peça 1:");
        let valor1 = Number(prompt("Valor da peça 1:"));
        let quant1 = Number(prompt("Quantidade da peça 1:"));

        let cod2 = prompt("Código da peça 2:");

        document.write("Total a pagar :" + total)
